name: Publish Docker Image

# Build the scoped image from docker/Dockerfile and publish it separately from
# the unmodified upstream main at ghcr.io/<owner>/<repo>-multitenant.
#
# Triggers and tags:
#   - push to multitenant:                    `tip` + the short commit hash
#   - workflow_call from release.yml:          `latest` + the release tag (e.g. v1.7.0),
#                                              built from the calling run's commit
#
# The image is multi-arch (linux/amd64 + linux/arm64). Each architecture is
# built NATIVELY on its own Blacksmith runner (no QEMU emulation), pushed by
# digest, and the two are then merged into a single multi-arch manifest per tag.
#
# Releases use the reusable workflow call. See docs/saas-deployment.md.
on:
  push:
    branches: [multitenant]
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish the image as (also tagged `latest`)"
        required: true
        type: string

# One in-flight publish per ref. New multitenant pushes replace only their own
# candidate build; versioned releases are never cancelled.
concurrency:
  group: publish-docker-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && inputs.release_tag == '' }}

# Least privilege: read the repo, and write packages to push the image to GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Source main may publish its global runtime to the unsuffixed package.
  IMAGE_NAME: ${{ github.repository }}-multitenant

jobs:
  # Build each architecture natively and push it to GHCR by digest (no tags yet).
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
            pair: linux-amd64
          # Native arm64 hardware; the `-arm` suffix picks a Blacksmith ARM runner.
          - platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require multitenant source
        if: github.ref != 'refs/heads/multitenant'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Scoped images must be published from multitenant, not ${REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # OCI image labels; tags are applied later, on the merged manifest.
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # GitHub cannot detect the modified Apache license, so the inferred label would be empty.
          labels: |
            org.opencontainers.image.licenses=LicenseRef-OpenConnector

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Install verifier dependencies
        run: npm ci

      # Blacksmith's Docker builder keeps a per-Dockerfile layer cache on a
      # sticky disk (one per architecture), so no cache-from/cache-to is needed.
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-manifest per arch; skip the provenance attestation.
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify architecture image
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          npm run verify:no-legacy-runtime -- --image "$image"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-arch digests into one multi-arch manifest per computed tag.
  merge:
    name: Merge & Push manifest
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tip + short-sha on push, latest + release tag when called from release.yml
      # (release.yml only produces stable X.Y.Z versions, so `latest` always moves).
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=tip,enable=${{ inputs.release_tag == '' }}
            type=sha,prefix=,format=short,enable=${{ inputs.release_tag == '' }}
            type=raw,value=latest,enable=${{ inputs.release_tag != '' }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

      - name: Record verified immutable image
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p qualification
          image_tag="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="sha256:$(docker buildx imagetools inspect "$image_tag" --raw | sha256sum | cut -d ' ' -f 1)"
          jq -n \
            --arg digest "$digest" \
            --arg commitSha "$COMMIT_SHA" \
            --arg runId "$RUN_ID" \
            '{status:"passed", digest:$digest, commitSha:$commitSha, runId:$runId}' \
            > qualification/image-verifier.json

      - name: Upload verified image qualification
        uses: actions/upload-artifact@v7
        with:
          name: open-connector-image-qualification
          path: qualification/image-verifier.json
          if-no-files-found: error
          retention-days: 90
