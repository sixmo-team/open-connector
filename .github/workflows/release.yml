name: Release

# Dispatch on multitenant. Compute the existing version/tag, create the draft,
# publish and verify the isolated scoped container, then publish the release.
# No npm runtime or standalone binary is distributed from this branch.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version to release, e.g. 1.7.0. Leave empty to bump the latest tag."
        required: false
        type: string
        default: ""
      version_bump:
        description: "Segment to bump when expected_version is empty."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Only one release at a time; a second dispatch queues behind the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag_name: ${{ steps.compute.outputs.tag_name }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      # The unmodified source main is not the scoped service release branch.
      - name: Require multitenant
        if: github.ref != 'refs/heads/multitenant'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Scoped release must be dispatched on multitenant, not ${REF}."
          exit 1

      - name: Compute version
        id: compute
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: node scripts/release/compute-release-version.ts

  draft-release:
    name: Draft GitHub release
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/publish-github-release.yml
    with:
      release_tag: ${{ needs.version.outputs.tag_name }}
      target_sha: ${{ github.sha }}
      previous_tag: ${{ needs.version.outputs.previous_tag }}
      publish: false

  # The private scoped service is distributed only as its verified container.

  docker:
    name: Docker image
    needs: [version, draft-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      release_tag: ${{ needs.version.outputs.tag_name }}

  publish-release:
    name: Publish GitHub release
    needs: [version, docker]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-github-release.yml
    with:
      release_tag: ${{ needs.version.outputs.tag_name }}
      target_sha: ${{ github.sha }}
      previous_tag: ${{ needs.version.outputs.previous_tag }}
      publish: true
