name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repository.
permissions:
  contents: read

env:
  NODE_VERSION: "24.22.2"

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: open_connector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_connector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No step needs the persisted GITHUB_TOKEN in git config; dropping it
          # keeps `npm ci` postinstall scripts from reading it (zizmor hardening).
          persist-credentials: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Runs postinstall codegen (provider registry + catalog).
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Check formatting (oxfmt)
        run: npm run format

      - name: Build scoped runtime and protected console
        run: npm run build

      - name: Validate generated action examples
        run: node --experimental-transform-types scripts/check-action-examples.ts

      - name: Verify generated catalog drift
        run: npm run verify:generated

      - name: Verify source runtime boundary
        run: npm run verify:no-legacy-runtime

      - name: Run tests
        run: npm test

      - name: Run real PostgreSQL RLS gate
        run: npm run test:rls
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/open_connector_test

      - name: Build final runtime image
        run: docker build -f docker/Dockerfile -t open-connector:verify .

      - name: Verify final runtime image
        run: npm run verify:no-legacy-runtime -- --image open-connector:verify
