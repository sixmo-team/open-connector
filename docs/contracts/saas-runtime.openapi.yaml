              schema: { $ref: "#/components/schemas/ManagedOAuthSource" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: selectWorkspaceOAuthSource
      summary: Explicitly select local authorization or a verified managed provider configuration
      description: >-
        Requires request_hash over the exact method, pathname, workspace target and original
        parsed JSON body. No query parameters or caller-selected customer identity are accepted.
        Managed selection validates the current bound project/configuration against the native
