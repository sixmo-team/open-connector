        persistence. Replacement must retain the established origin and project identity.
        The key is stored only through the workspace OpenBao codec, never returned or logged.
        No query parameters or customer scope fields are accepted; the JSON body is bounded to
        262144 bytes. Configuration does not enable any provider action or bypass product admission.
      tags: [Configuration]
      security: [{ ActionPolicyControlBearer: [] }]
      x-required-purpose: configuration:write
      x-policy-target: workspace
