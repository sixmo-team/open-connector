    delete:
      operationId: removeWorkspaceManagedProject
      summary: Erase an unused workspace project without discarding unresolved references
      description: >-
        Requires a signed mutation over exactly an empty JSON object and accepts no query
        parameters. Existing sources, connections, requests or cleanup tasks prevent removal.
        Secret deletion failure retains metadata for a genuine retry without decrypting an
