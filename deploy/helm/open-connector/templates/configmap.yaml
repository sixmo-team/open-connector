apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-connector.fullname" . }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  PORT: "3000"
  HOST: "0.0.0.0"
  OPEN_CONNECTOR_OPENBAO_TOKEN_FILE: /run/secrets/open_connector_openbao_token
  OPEN_CONNECTOR_JWKS_BEARER_TOKEN_FILE: /run/secrets/open_connector_jwks_bearer_token
  {{- range $name, $value := .Values.config }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
