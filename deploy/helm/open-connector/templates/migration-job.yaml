{{- if .Values.database.migration.enabled -}}
{{- $jobName := printf "%s-migrate" (include "open-connector.fullname" . | trunc 55 | trimSuffix "-") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "open-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.database.migration.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "open-connector.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "open-connector.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--experimental-transform-types", "scripts/saas-migrate.ts"]
          env:
            - name: OPEN_CONNECTOR_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secret.existingSecret is required" .Values.secret.existingSecret }}
                  key: OPEN_CONNECTOR_POSTGRES_URL
                  optional: false
            - name: OPEN_CONNECTOR_POSTGRES_MIGRATOR_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.migration.existingSecret is required" .Values.database.migration.existingSecret }}
                  key: OPEN_CONNECTOR_POSTGRES_MIGRATOR_URL
                  optional: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
